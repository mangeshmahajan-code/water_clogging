<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Log Reporter - Community Clogging Reports</title>
  <meta name="description"
    content="Report water logged areas in your neighborhood and help local authorities respond faster. Together, we can create a safer community." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="../static/css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          borderRadius: {
            'xl': '0.75rem',
            '2xl': '1rem',
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body class="bg-gradient-to-br from-blue-50 to-cyan-50 min-h-screen text-gray-900 flex flex-col justify-between">

  <div class="flex-grow flex flex-col">
    <header class="header-glass">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex items-center justify-between">
          <a href="/" class="flex items-center gap-3 hover:opacity-90 transition-opacity">
            <img src="../static/images/logo.svg" class="w-10 h-10" alt="Logo" />
            <h1 class="text-xl font-bold text-blue-900 tracking-tight">Water Log Reporter</h1>
          </a>


          <nav class="hidden md:flex items-center gap-6">

            <a href="/" class="text-black-600 hover:text-blue-600 font-medium transition-colors">Home</a>
            <a href="/#clogged-areas-section"
              class="text-black-600 hover:text-blue-600 font-medium transition-colors">Water Clogged Areas</a>
            {% if not current_user.is_authenticated %}
            <a href="/login" class="text-black-600 hover:text-blue-600 font-medium transition-colors">Login</a>
            <a href="{{url_for('report')}}"
              class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition-colors shadow-sm cursor-pointer">Report</a>
            {% else %}
            <a href="{{url_for('logout')}}"
              class="text-black-600 hover:text-blue-600 font-medium transition-colors">Logout</a>
            <a href="{{url_for('report')}}"
              class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition-colors shadow-sm cursor-pointer">Report</a>
            {% endif %}
          </nav>


          <button id="sidebar-toggle"
            class="block md:hidden text-gray-600 hover:text-gray-900 focus:outline-none cursor-pointer"
            aria-label="Open navigation menu">
            <i data-lucide="menu" class="w-6 h-6"></i>
          </button>
        </div>
      </div>
    </header>


    <div id="sidebar-overlay"
      class="fixed inset-0 bg-black/40 z-50 transition-opacity duration-300 opacity-0 pointer-events-none"></div>


    <aside id="sidebar-menu"
      class="fixed top-0 right-0 h-full w-64 bg-white z-[100] shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">

      <div class="flex items-center justify-between px-6 py-5 border-b border-gray-100">
        <span class="font-bold text-blue-900">Menu</span>
        <button id="sidebar-close" class="text-gray-500 hover:text-gray-800 focus:outline-none cursor-pointer"
          aria-label="Close navigation menu">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>


      <nav class="flex-grow px-6 py-6 flex flex-col gap-4">
        <a href="{{ url_for('index') }}"
          class="flex items-center gap-3 text-gray-700 hover:text-blue-600 font-medium py-2 transition-colors border-b border-gray-50">
          <i data-lucide="home" class="w-5 h-5 text-gray-400"></i> Home
        </a>
        <a href="/#clogged-areas-section"
          class="flex items-center gap-3 text-gray-700 hover:text-blue-600 font-medium py-2 transition-colors border-b border-gray-50">
          <i data-lucide="map" class="w-5 h-5 text-gray-400"></i> Water Clogged Areas
        </a>
        {% if not current_user.is_authenticated %}
        <a href="{{url_for('login')}}"
          class="flex items-center gap-3 text-gray-700 hover:text-blue-600 font-medium py-2 transition-colors border-b border-gray-50">
          <i data-lucide="log-in" class="w-5 h-5 text-gray-400"></i> Login
        </a>
        <a href="{{url_for('report')}}"
          class="flex items-center gap-3 text-white bg-blue-600 hover:bg-blue-700 font-medium px-4 py-2.5 rounded-lg transition-colors shadow-sm justify-center mt-2">
          <i data-lucide="user-plus" class="w-5 h-5"></i> report
        </a>
        {% else %}
        <a href="{{url_for('logout')}}"
          class="flex items-center gap-3 text-gray-700 hover:text-blue-600 font-medium py-2 transition-colors border-b border-gray-50">
          <i data-lucide="log-in" class="w-5 h-5 text-gray-400"></i> logout
        </a>
        <a href="{{url_for('report')}}"
          class="flex items-center gap-3 text-white bg-blue-600 hover:bg-blue-700 font-medium px-4 py-2.5 rounded-lg transition-colors shadow-sm justify-center mt-2">
          <i data-lucide="user-plus" class="w-5 h-5"></i> report
        </a>
        {% endif %}
      </nav>
    </aside>
